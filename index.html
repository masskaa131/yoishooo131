<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Apple Music Like PWA Player</title>
<!-- MP3/音声メタデータ解析ライブラリ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<!-- PWA & Web App Settings -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">

<!-- External CSS Libraries -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
/* ==========================================
1. Global Styles & Theme Variables
========================================== */
:root {
--bg-black: #000000;
--bg-glass: rgba(25, 25, 25, 0.78);
--card-glass: rgba(38, 38, 42, 0.65);
--card-glass-hover: rgba(55, 55, 60, 0.8);
--accent-color: #fa233b; /* Apple Music Red */
--accent-color-hover: #ff3b52;
--text-main: #ffffff;
--text-sub: #a1a1a6;
--border-glass: rgba(255, 255, 255, 0.12);
--modal-glass: rgba(30, 30, 32, 0.88);
--player-bg: rgba(18, 18, 20, 0.92);
}

* {
box-sizing: border-box;
-webkit-tap-highlight-color: transparent;
}

body {
background-color: var(--bg-black);
color: var(--text-main);
font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
margin: 0;
padding: 0;
padding-bottom: 140px;
user-select: none;
-webkit-user-select: none;
overflow-x: hidden;
}

/* Scrollbar Design */
::-webkit-scrollbar {
width: 6px;
height: 6px;
}
::-webkit-scrollbar-track {
background: rgba(0, 0, 0, 0.2);
}
::-webkit-scrollbar-thumb {
background: rgba(255, 255, 255, 0.2);
border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
background: rgba(255, 255, 255, 0.4);
}

/* Glassmorphism Utilities */
.glass-header {
background: var(--bg-glass);
backdrop-filter: blur(25px);
-webkit-backdrop-filter: blur(25px);
border-bottom: 1px solid var(--border-glass);
}

.glass-card {
background: var(--card-glass);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid var(--border-glass);
border-radius: 16px;
padding: 16px;
transition: background 0.2s ease, transform 0.2s ease;
}

.glass-modal {
background: var(--modal-glass) !important;
backdrop-filter: blur(30px) !important;
-webkit-backdrop-filter: blur(30px) !important;
border: 1px solid var(--border-glass) !important;
color: var(--text-main);
border-radius: 20px;
}

/* ==========================================
2. Navigation & Header
========================================== */
.app-header {
position: sticky;
top: 0;
z-index: 100;
padding: 16px 20px;
display: flex;
justify-content: space-between;
align-items: center;
padding-top: env(safe-area-inset-top, 20px);
}

.app-title {
font-size: 22px;
font-weight: 700;
letter-spacing: -0.5px;
display: flex;
align-items: center;
}

.nav-tabs-custom {
display: flex;
gap: 12px;
margin-bottom: 20px;
border-bottom: 1px solid var(--border-glass);
padding-bottom: 10px;
}

.nav-tab-btn {
background: none;
border: none;
color: var(--text-sub);
font-size: 16px;
font-weight: 600;
padding: 6px 16px;
border-radius: 20px;
cursor: pointer;
transition: all 0.2s;
}

  /* ボタンアクティブ時の色（Apple Music風の赤など）を明示 */
.player-controls button.active,
.full-controls button.active {
  color: var(--accent-color) !important;
}

/* 1曲リピート時の「1」のバッジ */
.repeat-badge {
  font-size: 9px;
  position: absolute;
  top: 2px;
  right: 2px;
  font-weight: bold;
  background: var(--accent-color);
  color: #fff;
  border-radius: 50%;
  width: 12px;
  height: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}
  
.nav-tab-btn.active {
background: var(--accent-color);
color: #fff;
}

.search-bar input,
input[type="search"],
input[type="text"] {
color: #ffffff !important;
background-color: rgba(255, 255, 255, 0.15);
}

input::placeholder {
color: #bbb !important;
}

/* ==========================================
3. Batch Operation Toolbar
========================================== */
.batch-toolbar {
display: none;
background: rgba(250, 35, 59, 0.15);
border: 1px solid var(--accent-color);
border-radius: 14px;
padding: 12px 18px;
margin-bottom: 16px;
align-items: center;
justify-content: space-between;
animation: fadeIn 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
}

.batch-toolbar.active {
display: flex;
}

/* ==========================================
4. Song & Playlist List Views
========================================== */
.song-list {
list-style: none;
padding: 0;
margin: 0;
}

.song-item {
display: flex;
align-items: center;
padding: 10px 14px;
border-radius: 14px;
margin-bottom: 8px;
transition: background 0.2s, border-color 0.2s;
background: rgba(255, 255, 255, 0.03);
border: 1px solid transparent;
}

.song-item:hover {
background: rgba(255, 255, 255, 0.07);
}

.song-item.active {
background: rgba(250, 35, 59, 0.18);
border-color: rgba(250, 35, 59, 0.4);
}

.song-checkbox {
width: 22px;
height: 22px;
margin-right: 14px;
accent-color: var(--accent-color);
cursor: pointer;
}

.song-cover {
width: 50px;
height: 50px;
border-radius: 10px;
object-fit: cover;
margin-right: 14px;
background: #2c2c2e;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
overflow: hidden;
cursor: pointer;
box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.song-cover img {
width: 100%;
height: 100%;
object-fit: cover;
}

.song-details {
flex: 1;
overflow: hidden;
cursor: pointer;
}

.song-title {
font-size: 15px;
font-weight: 600;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
color: var(--text-main);
}

.song-artist {
font-size: 13px;
color: var(--text-sub);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
margin-top: 2px;
}

.song-actions {
display: flex;
align-items: center;
gap: 8px;
}

.btn-action-icon {
background: none;
border: none;
color: var(--text-sub);
font-size: 16px;
padding: 8px;
border-radius: 50%;
cursor: pointer;
transition: color 0.2s, background 0.2s;
}

.btn-action-icon:hover {
color: #fff;
background: rgba(255, 255, 255, 0.1);
}

/* Playlist Grid */
.playlist-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
gap: 16px;
}

.playlist-card {
background: var(--card-glass);
border: 1px solid var(--border-glass);
border-radius: 16px;
padding: 14px;
text-align: center;
cursor: pointer;
transition: transform 0.2s, background 0.2s;
position: relative;
}

.playlist-card:hover {
transform: translateY(-4px);
background: var(--card-glass-hover);
}

.playlist-cover-placeholder {
width: 100%;
aspect-ratio: 1;
border-radius: 12px;
background: #252528;
display: flex;
align-items: center;
justify-content: center;
font-size: 38px;
color: var(--accent-color);
margin-bottom: 10px;
overflow: hidden;
}

.playlist-cover-placeholder img {
width: 100%;
height: 100%;
object-fit: cover;
}

.playlist-delete-btn {
position: absolute;
top: 8px;
right: 8px;
background: rgba(0,0,0,0.6);
color: #fff;
border: none;
border-radius: 50%;
width: 28px;
height: 28px;
display: flex;
align-items: center;
justify-content: center;
font-size: 12px;
cursor: pointer;
}

.drop-zone {
border: 2px dashed var(--border-glass);
border-radius: 16px;
padding: 24px;
text-align: center;
background: rgba(255, 255, 255, 0.02);
transition: border-color 0.2s, background 0.2s;
cursor: pointer;
}

.drop-zone.dragover {
border-color: var(--accent-color);
background: rgba(250, 35, 59, 0.08);
}

/* ==========================================
5. Mini Player (Bottom Bar)
========================================== */
.player-bar {
position: fixed;
bottom: 0;
left: 0;
right: 0;
height: 86px;
background: var(--player-bg);
backdrop-filter: blur(30px);
-webkit-backdrop-filter: blur(30px);
border-top: 1px solid var(--border-glass);
display: flex;
align-items: center;
padding: 0 16px;
z-index: 200;
box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
}

.player-mini-info {
display: flex;
align-items: center;
flex: 1;
overflow: hidden;
cursor: pointer;
}

.player-mini-cover {
width: 52px;
height: 52px;
border-radius: 10px;
background: #2c2c2e;
display: flex;
align-items: center;
justify-content: center;
margin-right: 14px;
flex-shrink: 0;
overflow: hidden;
}

.player-mini-cover img {
width: 100%;
height: 100%;
object-fit: cover;
}

.player-mini-details {
overflow: hidden;
}

.player-mini-title {
font-size: 15px;
font-weight: 600;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.player-mini-artist {
font-size: 13px;
color: var(--text-sub);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.player-controls {
display: flex;
align-items: center;
gap: 12px;
}

.player-controls button {
background: none;
border: none;
color: var(--text-sub);
font-size: 18px;
cursor: pointer;
position: relative;
transition: color 0.2s, transform 0.1s;
padding: 6px;
}

.player-controls button:active {
transform: scale(0.88);
}

.player-controls button.active {
color: var(--accent-color);
}

.player-controls button.btn-play {
font-size: 26px;
color: var(--text-main);
}

.mini-progress-container {
position: absolute;
top: 0;
left: 0;
right: 0;
height: 3px;
background: rgba(255, 255, 255, 0.1);
cursor: pointer;
}

.mini-progress-bar {
height: 100%;
background: var(--accent-color);
width: 0%;
transition: width 0.1s linear;
}

/* ==========================================
6. Fullscreen Expand Player Modal
========================================== */
/* ==========================================
6. Fullscreen Expand Player Modal
========================================== */
.full-player-modal {
  position: fixed;
  top: 100%;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(15, 15, 18, 0.96);
  backdrop-filter: blur(40px);
  -webkit-backdrop-filter: blur(40px);
  z-index: 300;
  transition: top 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
  display: flex;
  flex-direction: column;
  padding: 24px;
  overflow-y: auto;
  /* ▼ ここに移動・統合 */
  overflow: hidden;
  transition: top 0.35s cubic-bezier(0.1, 0.9, 0.2, 1), background-color 0.8s ease;
}

.full-player-modal.active {
  top: 0;
}

.full-player-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 20px;
}

.full-player-cover-container {
width: 100%;
max-width: 340px;
aspect-ratio: 1;
margin: 20px auto;
border-radius: 20px;
background: #2c2c2e;
overflow: hidden;
box-shadow: 0 20px 40px rgba(0,0,0,0.6);
display: flex;
align-items: center;
justify-content: center;
}

.full-player-cover-container img {
width: 100%;
height: 100%;
object-fit: cover;
}

.full-player-info {
text-align: center;
margin-bottom: 24px;
}

.full-player-title {
font-size: 22px;
font-weight: 700;
margin-bottom: 4px;
}

.full-player-artist {
font-size: 16px;
color: var(--text-sub);
}

.seek-slider-container {
margin-bottom: 20px;
}

.seek-slider {
width: 100%;
accent-color: var(--accent-color);
height: 6px;
background: rgba(255, 255, 255, 0.2);
border-radius: 3px;
outline: none;
}

.time-stamps {
display: flex;
justify-content: space-between;
font-size: 12px;
color: var(--text-sub);
margin-top: 6px;
}

.full-controls {
display: flex;
justify-content: space-around;
align-items: center;
margin-bottom: 30px;
}

.full-controls button {
background: none;
border: none;
color: var(--text-main);
font-size: 22px;
cursor: pointer;
position: relative;
}

.full-controls button.btn-main-play {
font-size: 48px;
color: var(--accent-color);
}

.volume-container {
display: flex;
align-items: center;
gap: 12px;
color: var(--text-sub);
padding: 0 10px;
}

.volume-slider {
flex: 1;
accent-color: var(--text-sub);
height: 4px;
}

.form-control-dark {
background: rgba(255, 255, 255, 0.08);
border: 1px solid var(--border-glass);
color: #fff;
border-radius: 10px;
}

.form-control-dark:focus {
background: rgba(255, 255, 255, 0.15);
color: #fff;
border-color: var(--accent-color);
box-shadow: none;
}

.modal-overlay {
position: fixed;
top: 0;
left: 0;
right: 0;
bottom: 0;
background: rgba(0, 0, 0, 0.75);
backdrop-filter: blur(15px);
-webkit-backdrop-filter: blur(15px);
z-index: 400;
display: flex;
justify-content: center;
align-items: flex-end;
}

.modal-overlay .modal-content {
background: var(--modal-glass);
border-top: 1px solid var(--border-glass);
border-radius: 20px 20px 0 0;
width: 100%;
max-height: 80vh;
padding: 20px;
overflow-y: auto;
}

.modal-overlay .modal-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 16px;
border-bottom: 1px solid var(--border-glass);
padding-bottom: 10px;
}

.modal-overlay .close-btn {
background: none;
border: none;
color: var(--text-main);
font-size: 24px;
cursor: pointer;
}

/* ジャケットの色を元にふんわり光る背景エフェクト */
.ambient-glow {
  position: absolute;
  top: -20%;
  left: -20%;
  width: 140%;
  height: 140%;
  background: radial-gradient(circle, var(--ambient-color, rgba(100,100,100,0.3)) 0%, rgba(0,0,0,0.8) 70%);
  opacity: 0.6;
  z-index: -1;
  pointer-events: none;
  filter: blur(60px);
  transition: background 1s ease;
}
@keyframes fadeIn {
from { opacity: 0; transform: translateY(-6px); }
to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<!-- App Header -->
<header class="app-header glass-header">
<div class="app-title"><i class="fa-solid fa-music text-danger me-2"></i>ライブラリ</div>
<div class="d-flex gap-2">
<button class="btn btn-sm btn-outline-light rounded-pill" onclick="toggleBatchMode()">
<i class="fa-solid fa-list-check me-1"></i>選択
</button>
<button class="btn btn-sm btn-outline-secondary rounded-circle" onclick="openSettingsModal()">
<i class="fa-solid fa-gear"></i>
</button>
</div>
</header>

<div class="container mt-3">

<!-- Navigation Tabs -->
<div class="nav-tabs-custom">
  <button class="nav-tab-btn active" data-tab="songs" onclick="switchTab('songs')">すべての曲</button>
  <button class="nav-tab-btn" data-tab="playlists" onclick="switchTab('playlists')">プレイリスト</button>
</div>

<!-- SONGS TAB CONTENT -->
<div id="songsTabContent">
<!-- Search & Sort Controls -->
<div class="glass-card mb-3">
<div class="row g-2">
<div class="col-7">
<input type="text" id="searchInput" class="form-control form-control-dark form-control-sm" placeholder="曲名、歌手名で検索..." oninput="renderSongs()">
</div>
<div class="col-5">
<select id="sortSelect" class="form-select form-select-dark form-select-sm form-control-dark" onchange="renderSongs()">
<option value="newest">追加順</option>
<option value="title">曲名順</option>
<option value="artist">歌手順</option>
</select>
</div>
</div>
</div>

<!-- Batch Operation Toolbar -->
<div id="batchToolbar" class="batch-toolbar">
<div class="d-flex align-items-center">
<input type="checkbox" id="selectAllCheckbox" class="song-checkbox" onchange="toggleSelectAll(this.checked)">
<span id="selectedCountText" class="small fw-bold">0件選択中</span>
</div>
<div class="d-flex gap-2">
<select id="batchPlaylistSelect" class="form-select form-select-sm form-control-dark" style="width: 130px;">
<option value="">追加先...</option>
</select>
<button class="btn btn-sm btn-danger" title="プレイリストへ追加" onclick="executeBatchAddToPlaylist()"><i class="fa-solid fa-plus"></i></button>
<button class="btn btn-sm btn-outline-danger" title="削除" onclick="executeBatchDelete()"><i class="fa-solid fa-trash"></i></button>
</div>
</div>

<!-- File Import Drop Zone -->
<div class="glass-card mb-3">
<div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
<i class="fa-solid fa-cloud-arrow-up text-danger mb-2" style="font-size: 28px;"></i>
<div class="fw-bold small">楽曲ファイルを追加 (タップして選択)</div>
<div class="text-muted style-sub" style="font-size: 11px;">MP3, WAV, AAC, M4A, FLAC等に対応</div>
<input type="file" id="fileInput" accept="audio/*, .mp3, .wav, .m4a, .aac, .flac, .ogg" multiple style="display: none;" onchange="handleFileImport(this.files)">
</div>
</div>

<!-- Song List Container -->
<ul id="songListContainer" class="song-list"></ul>
</div>

<!-- PLAYLISTS TAB CONTENT -->
<div id="playlistsTabContent" style="display: none;">
<div class="d-flex justify-content-between align-items-center mb-3">
<h5 class="fw-bold m-0">マイプレイリスト</h5>
<button class="btn btn-sm btn-danger rounded-pill" onclick="openCreatePlaylistModal()">
<i class="fa-solid fa-plus me-1"></i>新規作成
</button>
</div>

<div id="playlistGrid" class="playlist-grid"></div>
</div>

</div>

<!-- Persistent Player Bar (Mini Player) -->
<div class="player-bar">
<div class="mini-progress-container" onclick="seekMiniPlayer(event)">
<div class="mini-progress-bar" id="miniProgressBar"></div>
</div>
<div class="player-mini-info" onclick="openFullPlayer()">
<div class="player-mini-cover" id="playerMiniCover">
<i class="fa-solid fa-music text-secondary"></i>
</div>
<div class="player-mini-details">
<div class="player-mini-title" id="playerMiniTitle">未再生</div>
<div class="player-mini-artist" id="playerMiniArtist">楽曲を選択してください</div>
</div>
</div>
<div class="player-controls">
<button id="miniShuffleBtn" class="player-ctrl-btn" onclick="toggleShuffle()" title="シャッフル"><i class="fa-solid fa-shuffle"></i></button>
<button class="btn-play" onclick="togglePlay()"><i class="fa-solid fa-play" id="miniPlayBtnIcon"></i></button>
<button onclick="playNext()" title="次の曲"><i class="fa-solid fa-forward"></i></button>
<button id="miniRepeatBtn" class="player-ctrl-btn" onclick="toggleRepeat()" title="リピート">
  <i class="fa-solid fa-repeat"></i>
  <span id="repeatIndicator" class="repeat-badge" style="display:none;">1</span>
</button>
</div>
</div>

<!-- Fullscreen Expand Player Modal -->
<div id="fullPlayerModal" class="full-player-modal">
  <div id="ambientGlow" class="ambient-glow"></div>
<div class="full-player-header">
<button class="btn-action-icon" onclick="closeFullPlayer()"><i class="fa-solid fa-chevron-down"></i></button>
<span class="small text-muted fw-bold">再生中</span>
<button class="btn-action-icon" onclick="openCurrentPlaylistModal()"><i class="fa-solid fa-list-ul"></i></button>
</div>

<div class="full-player-cover-container" id="fullPlayerCover">
<i class="fa-solid fa-music text-secondary" style="font-size: 80px;"></i>
</div>

<div class="full-player-info">
<div class="full-player-title" id="fullPlayerTitle">未再生</div>
<div class="full-player-artist" id="fullPlayerArtist">楽曲を選択してください</div>
</div>

<div class="seek-slider-container">
<input type="range" id="fullSeekSlider" class="seek-slider" min="0" max="100" value="0" oninput="onSeekSliderChange(this.value)">
<div class="time-stamps">
<span id="currentTimeText">0:00</span>
<span id="durationTimeText">0:00</span>
</div>
</div>

<div class="full-controls">
<button id="fullShuffleBtn" onclick="toggleShuffle()"><i class="fa-solid fa-shuffle"></i></button>
<button onclick="playPrev()"><i class="fa-solid fa-backward"></i></button>
<button class="btn-main-play" onclick="togglePlay()"><i class="fa-solid fa-circle-play" id="fullPlayBtnIcon"></i></button>
<button onclick="playNext()"><i class="fa-solid fa-forward"></i></button>
<button id="fullRepeatBtn" onclick="toggleRepeat()"><i class="fa-solid fa-repeat"></i></button>
</div>

<div class="volume-container">
<i class="fa-solid fa-volume-low"></i>
<input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">
<i class="fa-solid fa-volume-high"></i>
</div>
  <!-- ▼【ここに追加】ボリュームスライダーの下に配置 -->
<div class="player-extra-controls my-3 text-center px-3">
  
  <!-- 再生速度変更 -->
  <div class="d-flex align-items-center justify-content-center mb-2">
    <label class="text-muted small me-2">再生速度:</label>
    <select id="playbackRateSelect" class="form-select form-select-sm w-auto" onchange="setPlaybackRate(this.value)">
      <option value="0.5">0.5x</option>
      <option value="0.75">0.75x</option>
      <option value="1.0" selected>1.0x</option>

<script>
/* ==========================================
1. Database Architecture (IndexedDB)
========================================== */
const DB_NAME = 'AppleMusicPWADB_Full_v2';
const DB_VERSION = 1;
let db = null;
let dbInitPromise = null;

function initDB() {
  if (dbInitPromise) return dbInitPromise;

  dbInitPromise = new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    
    request.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains('songs')) {
        database.createObjectStore('songs', { keyPath: 'id', autoIncrement: true });
      }
      if (!database.objectStoreNames.contains('playlists')) {
        database.createObjectStore('playlists', { keyPath: 'id', autoIncrement: true });
      }
    };
    
    request.onsuccess = (e) => {
      db = e.target.result;
      db.onversionchange = () => {
        db.close();
        db = null;
      };
      resolve(db);
    };
    
    request.onerror = (e) => {
      dbInitPromise = null;
      reject(e.target?.error || new Error('IndexedDB open error'));
    };
  });

  return dbInitPromise;
}

async function ensureDB() {
  if (db) return db;
  return await initDB();
}

/* ==========================================
2. Application State Management
========================================== */
let songsData = [];
let playlistsData = [];
let activeTab = 'songs';
let isBatchMode = false;
let selectedSongIds = new Set();

// Web Audio API
let audioCtx;
let gainNode;
let trackSource;

// Playback State
let currentPlayingIndex = -1;
let isShuffle = false;
let repeatMode = 'OFF'; // 'OFF' | 'ALL' | 'ONE'
let currentAudioUrl = null;
let editingSongId = null;
let isSeeking = false;
// 追加：再生速度の状態保持
let currentPlaybackRate = 1.0;
  // 追加：スリープタイマー管理
let sleepTimerId = null;
let sleepTimerMode = null; // 分数（数値）または 'end'
/* ==========================================
3. Lifecycle & Initialization
========================================== */
window.addEventListener('DOMContentLoaded', async () => {
  try {
    await ensureDB();
    await loadSongsFromDB();
    await loadPlaylistsFromDB();
    setupDragAndDrop();
    setupAudioErrorHandling();
    
    // ▼【ここに追加】アプリ起動時にaudio要素のピッチを固定
    const audio = document.getElementById('audioPlayer');
    if (audio) {
      audio.preservesPitch = true;
      audio.webkitPreservesPitch = true;
      audio.mozPreservesPitch = true;
    }

    populatePlaylistDropdown();
    renderSongs();
    renderPlaylists();
  } catch (err) {
    console.error("初期化エラー:", err);
  }
});

  

/* ==========================================
4. DB Sync Functions
========================================== */
async function loadSongsFromDB() {
  const database = await ensureDB();
  return new Promise((resolve) => {
    const tx = database.transaction('songs', 'readonly');
    const store = tx.objectStore('songs');
    const req = store.getAll();
    req.onsuccess = () => {
      songsData = req.result || [];
      resolve();
    };
    req.onerror = () => {
      songsData = [];
      resolve();
    };
  });
}

async function loadPlaylistsFromDB() {
  const database = await ensureDB();
  return new Promise((resolve) => {
    const tx = database.transaction('playlists', 'readonly');
    const store = tx.objectStore('playlists');
    const req = store.getAll();
    req.onsuccess = async () => {
      playlistsData = req.result || [];
      if (playlistsData.length === 0) {
        const p1 = { name: 'お気に入り', coverUrl: '', songIds: [] };
        const p2 = { name: 'ドライブ', coverUrl: '', songIds: [] };
        try {
          await savePlaylistToDB(p1);
          await savePlaylistToDB(p2);
          playlistsData = [p1, p2];
        } catch (e) {
          console.warn("初期プレイリスト保存をスキップ", e);
        }
      }
      resolve();
    };
    req.onerror = () => {
      playlistsData = [];
      resolve();
    };
  });
}

async function saveSongToDB(song) {
  const database = await ensureDB();
  return new Promise((resolve, reject) => {
    const tx = database.transaction('songs', 'readwrite');
    const store = tx.objectStore('songs');
    const req = store.add(song);
    req.onsuccess = () => {
      song.id = req.result;
      resolve(song);
    };
    req.onerror = (e) => reject(e.target?.error || e);
  });
}

async function deleteSongFromDB(id) {
  const database = await ensureDB();
  return new Promise((resolve) => {
    const tx = database.transaction('songs', 'readwrite');
    const store = tx.objectStore('songs');
    store.delete(id).onsuccess = () => resolve();
  });
}

async function savePlaylistToDB(playlist) {
  const database = await ensureDB();
  return new Promise((resolve, reject) => {
    const tx = database.transaction('playlists', 'readwrite');
    const store = tx.objectStore('playlists');
    const req = store.add(playlist);
    req.onsuccess = () => {
      playlist.id = req.result;
      resolve(playlist);
    };
    req.onerror = (e) => reject(e.target?.error || e);
  });
}

/* ==========================================
5. UI Navigation & Rendering
========================================== */
function hideBootstrapModal(modalId) {

function switchTab(tab) {

    if (btn.dataset.tab === tab) {

  const songsTab = document.getElementById('songsTabContent');
  const playlistsTab = document.getElementById('playlistsTabContent');
  if (songsTab) songsTab.style.display = tab === 'songs' ? 'block' : 'none';
  if (playlistsTab) playlistsTab.style.display = tab === 'playlists' ? 'block' : 'none';

  if (tab === 'playlists') renderPlaylists();
}

function renderSongs() {
  const container = document.getElementById('songListContainer');
  const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
  const sortBy = document.getElementById('sortSelect').value;

  let filtered = songsData.filter(s => {
    if (!searchQuery) return true;
    const title = (s.title || '').toLowerCase();
    const artist = (s.artist || '').toLowerCase();
    return title.includes(searchQuery) || artist.includes(searchQuery);
  });

  if (sortBy === 'title') {
    filtered.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
  } else if (sortBy === 'artist') {
    filtered.sort((a, b) => (a.artist || '').localeCompare(b.artist || ''));
  } else {
    filtered.sort((a, b) => (b.id || 0) - (a.id || 0));
  }

  container.innerHTML = '';

  if (filtered.length === 0) {
    container.innerHTML = `<li class="text-center text-muted py-5 small">楽曲が見つかりません</li>`;
    return;
  }

  filtered.forEach(song => {
    const li = document.createElement('li');
    const isPlaying = currentPlayingIndex !== -1 && songsData[currentPlayingIndex]?.id === song.id;
    li.className = `song-item ${isPlaying ? 'active' : ''}`;

    const isChecked = selectedSongIds.has(song.id);

    li.innerHTML = `
      ${isBatchMode ? `<input type="checkbox" class="song-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleSelectSong(${song.id})">` : ''}
      <div class="song-cover" onclick="playSongById(${song.id})">
      ${song.coverUrl ? `<img src="${song.coverUrl}">` : `<i class="fa-solid ${isPlaying ? 'fa-volume-high text-danger' : 'fa-music text-secondary'}"></i>`}
      </div>
      <div class="song-details" onclick="${isBatchMode ? `toggleSelectSong(${song.id})` : `playSongById(${song.id})`}">
      <div class="song-title">${escapeHtml(song.title)}</div>
      <div class="song-artist">${escapeHtml(song.artist)}</div>
      </div>
      <div class="song-actions">
      <button class="btn-action-icon" onclick="openEditSongModal(${song.id})"><i class="fa-solid fa-pen"></i></button>
      <button class="btn-action-icon" onclick="deleteSingleSong(${song.id})"><i class="fa-solid fa-trash"></i></button>
      </div>
    `;
    container.appendChild(li);
  });

  updateBatchToolbarUI();
}

function renderPlaylists() {
  const container = document.getElementById('playlistGrid');
  if (!container) return;
  container.innerHTML = '';

  if (playlistsData.length === 0) {
    container.innerHTML = `<div class="col-12 text-center text-muted py-4 small">プレイリストがありません</div>`;

  }

  playlistsData.forEach(playlist => {

      <div class="text-muted style-sub" style="font-size: 11px;">${playlist.songIds ? playlist.songIds.length : 0}曲</div>

async function deletePlaylist(id) {
  const playlist = playlistsData.find(p => p.id === id);
  const name = playlist ? playlist.name : 'このプレイリスト';

  if (!confirm(`「${name}」を削除してもよろしいですか？\n（※楽曲データ自体は削除されません）`)) return;

  const database = await ensureDB();
  const tx = database.transaction('playlists', 'readwrite');

  playlistsData = playlistsData.filter(p => p.id !== id);

  populatePlaylistDropdown();

}

/* ==========================================
6. File Import & Processing
========================================== */
function setupDragAndDrop() {
  const zone = document.getElementById('dropZone');
  if (!zone) return;

  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    zone.addEventListener(eventName, (e) => {
      e.preventDefault();
      e.stopPropagation();
    }, false);
  });

  ['dragenter', 'dragover'].forEach(eventName => {
    zone.addEventListener(eventName, () => zone.classList.add('dragover'), false);
  });

  ['dragleave', 'drop'].forEach(eventName => {
    zone.addEventListener(eventName, () => zone.classList.remove('dragover'), false);
  });

  zone.addEventListener('drop', (e) => {
    const dt = e.dataTransfer;
    if (dt && dt.files.length > 0) {
      handleFileImport(dt.files);
    }
  });
}

function parseAudioMetadata(file) {
  return new Promise((resolve) => {
    const defaultTitle = file.name ? file.name.replace(/\.[^/.]+$/, "") : "無題の楽曲";
    const fallbackData = { title: defaultTitle, artist: '不明なアーティスト', coverUrl: null };

    if (!window.jsmediatags) {
      resolve(fallbackData);
      return;
    }

    let isResolved = false;
    const timer = setTimeout(() => {
      if (!isResolved) {
        isResolved = true;
        resolve(fallbackData);
      }
    }, 1500);

    try {
      window.jsmediatags.read(file, {
        onSuccess: function(tag) {
          if (isResolved) return;
          clearTimeout(timer);
          isResolved = true;
          try {
            const tags = tag.tags;
            const title = tags.title ? tags.title.trim() : defaultTitle;
            const artist = tags.artist ? tags.artist.trim() : '不明なアーティスト';
            let coverUrl = null;

            if (tags.picture) {
              const { data, format } = tags.picture;
              let base64String = "";
              for (let i = 0; i < data.length; i++) {
                base64String += String.fromCharCode(data[i]);
              }
              coverUrl = `data:${format};base64,${window.btoa(base64String)}`;
            }
            resolve({ title, artist, coverUrl });
          } catch(e) {
            resolve(fallbackData);
          }
        },
        onError: function() {
          if (isResolved) return;
          clearTimeout(timer);
          isResolved = true;
          resolve(fallbackData);
        }
      });
    } catch(e) {
      if (!isResolved) {
        clearTimeout(timer);
        isResolved = true;
        resolve(fallbackData);
      }
    }
  });
}

async function handleFileImport(files) {
  if (!files || files.length === 0) return;
  let addedCount = 0;

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    try {
      const meta = await parseAudioMetadata(file);

      const newSong = {
        title: meta.title || (file.name ? file.name.replace(/\.[^/.]+$/, "") : "無題の楽曲"),
        artist: meta.artist || '不明なアーティスト',
        coverUrl: meta.coverUrl || null,
        audioBlob: file,
        addedAt: Date.now()
      };

      const saved = await saveSongToDB(newSong);
      songsData.unshift(saved);
      addedCount++;
    } catch (err) {
      console.error("ファイル保存エラー:", err);
    }
  }

  if (addedCount > 0) {
    renderSongs();
  } else {
    alert('ファイルの追加に失敗しました。');
  }

  const fileInput = document.getElementById('fileInput');
  if (fileInput) fileInput.value = '';
}

async function deleteSingleSong(id) {
  if (!confirm('この楽曲を削除してもよろしいですか？')) return;
  await deleteSongFromDB(id);
  songsData = songsData.filter(s => s.id !== id);
  selectedSongIds.delete(id);

  if (currentPlayingIndex !== -1 && songsData[currentPlayingIndex]?.id === id) {
    const audio = document.getElementById('audioPlayer');
    audio.pause();
    currentPlayingIndex = -1;
    updatePlayerUI();
  }

  renderSongs();
}

function openEditSongModal(songId) {
  const song = songsData.find(s => s.id === songId);
  if (!song) return;
  
  editingSongId = songId;
  document.getElementById('editSongTitle').value = song.title || '';
  document.getElementById('editSongArtist').value = song.artist || '';
  document.getElementById('editSongModal').style.display = 'flex';
}

function closeEditSongModal() {
  document.getElementById('editSongModal').style.display = 'none';
  editingSongId = null;
}

async function saveSongEdit() {
  if (!editingSongId) return;

  const newTitle = document.getElementById('editSongTitle').value.trim();
  const newArtist = document.getElementById('editSongArtist').value.trim();

  const song = songsData.find(s => s.id === editingSongId);
  if (song) {
    song.title = newTitle || '無題の楽曲';
    song.artist = newArtist || '不明なアーティスト';

    const database = await ensureDB();
    const tx = database.transaction('songs', 'readwrite');
    await tx.objectStore('songs').put(song);

    renderSongs();
    if (currentPlayingIndex !== -1 && songsData[currentPlayingIndex].id === editingSongId) {
      updatePlayerUI();
    }
  }

  closeEditSongModal();
}

/* ==========================================
7. Batch Processing Functions
========================================== */
function toggleBatchMode() {
  isBatchMode = !isBatchMode;
  if (!isBatchMode) {
    selectedSongIds.clear();
  }
  renderSongs();
}

function toggleSelectSong(id) {
  if (selectedSongIds.has(id)) {
    selectedSongIds.delete(id);
  } else {
    selectedSongIds.add(id);
  }
  renderSongs();
}

function toggleSelectAll(checked) {
  if (checked) {
    songsData.forEach(s => selectedSongIds.add(s.id));
  } else {
    selectedSongIds.clear();
  }
  renderSongs();
}

function updateBatchToolbarUI() {
  const toolbar = document.getElementById('batchToolbar');
  if (toolbar) toolbar.classList.toggle('active', isBatchMode);

  const countText = document.getElementById('selectedCountText');
  if (countText) countText.innerText = `${selectedSongIds.size}件選択中`;

  const selectAllCheckbox = document.getElementById('selectAllCheckbox');
  if (selectAllCheckbox) {
    selectAllCheckbox.checked = songsData.length > 0 && selectedSongIds.size === songsData.length;
  }
}

function populatePlaylistDropdown() {
  const select = document.getElementById('batchPlaylistSelect');
  if (!select) return;
  select.innerHTML = '<option value="">追加先...</option>';
  playlistsData.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.name;
    select.appendChild(opt);
  });
}

async function executeBatchAddToPlaylist() {
  const playlistId = Number(document.getElementById('batchPlaylistSelect').value);
  if (!playlistId) {
    alert('追加先のプレイリストを選択してください。');
    return;
  }
  if (selectedSongIds.size === 0) {
    alert('曲が選択されていません。');
    return;
  }

  const playlist = playlistsData.find(p => p.id === playlistId);
  if (playlist) {
    const newIds = Array.from(selectedSongIds);
    playlist.songIds = Array.from(new Set([...(playlist.songIds || []), ...newIds]));

    const database = await ensureDB();
    const tx = database.transaction('playlists', 'readwrite');
    await tx.objectStore('playlists').put(playlist);

    alert(`${selectedSongIds.size}曲を「${playlist.name}」に追加しました。`);
    selectedSongIds.clear();
    toggleBatchMode();
    renderPlaylists();
  }
}

async function executeBatchDelete() {
  if (selectedSongIds.size === 0) {
    alert('曲が選択されていません。');
    return;
  }

  if (!confirm(`選択した ${selectedSongIds.size} 件の楽曲を削除しますか？`)) return;

  for (let id of selectedSongIds) {
    await deleteSongFromDB(id);
  }

  songsData = songsData.filter(s => !selectedSongIds.has(s.id));
  selectedSongIds.clear();
  toggleBatchMode();
  renderSongs();
}

/* ==========================================
8. Audio Player Core Logic
========================================== */
function playSongById(id) {
  const index = songsData.findIndex(s => s.id === id);
  if (index !== -1) {
    playSongAtIndex(index);
  }
}
// 追加：スリープタイマーを設定する関数
function setSleepTimer(minutes) {
  const audio = document.getElementById('audioPlayer');
  
  if (sleepTimerId) {
    clearTimeout(sleepTimerId);
    sleepTimerId = null;
  }
  
  if (minutes === 'end') {
    sleepTimerMode = 'end';
    alert('現在の曲の終了時に再生を停止します');
    return;
  }
  
  const minNum = parseInt(minutes, 10);
  if (isNaN(minNum) || minNum <= 0) {
    sleepTimerMode = null;
    alert('スリープタイマーを解除しました');
    return;
  }
  
  sleepTimerMode = minNum;
  alert(`${minNum}分後に再生を停止します`);
  
  sleepTimerId = setTimeout(() => {
    if (audio) {
      audio.pause();
      updatePlayerUI();
    }
    sleepTimerId = null;
    sleepTimerMode = null;
    alert('スリープタイマーにより再生を停止しました');
  }, minNum * 60 * 1000);
}
function playSongAtIndex(index) {
  if (index < 0 || index >= songsData.length) return;

  currentPlayingIndex = index;
  const song = songsData[currentPlayingIndex];

  const audio = document.getElementById('audioPlayer');

  if (currentAudioUrl) {
    URL.revokeObjectURL(currentAudioUrl);
    currentAudioUrl = null;
  }

  if (song.audioBlob) {
    currentAudioUrl = URL.createObjectURL(song.audioBlob);
    audio.src = currentAudioUrl;
    
// 変更：固定値 1.0 ではなく、保持している currentPlaybackRate を適用する
    audio.playbackRate = currentPlaybackRate;
    audio.defaultPlaybackRate = currentPlaybackRate;
    audio.preservesPitch = true;
    audio.webkitPreservesPitch = true;
    audio.mozPreservesPitch = true;

    initWebAudio();
    audio.play().catch(e => console.error(e));
  } else {
    alert('この楽曲には音声データが紐付けられていません。');
    return;
  }

  updatePlayerUI();
  renderSongs();
}

function togglePlay() {
  const audio = document.getElementById('audioPlayer');
  if (currentPlayingIndex === -1) {
    if (songsData.length > 0) playSongAtIndex(0);
    return;
  }

  if (audio.paused) {
    initWebAudio();
    audio.play();
  } else {
    audio.pause();
  }
  updatePlayerUI();
}

function playNext() {
  if (songsData.length === 0) return;

  if (isShuffle) {
    const nextIndex = Math.floor(Math.random() * songsData.length);
    playSongAtIndex(nextIndex);
  } else {
    let nextIndex = currentPlayingIndex + 1;
    if (nextIndex >= songsData.length) {
      if (repeatMode === 'ALL') {
        nextIndex = 0;
      } else {
        return;
      }
    }
    playSongAtIndex(nextIndex);
  }
}

function initWebAudio() {
  const audio = document.getElementById('audioPlayer');
  if (!audio) return;

  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    gainNode = audioCtx.createGain();
    trackSource = audioCtx.createMediaElementSource(audio);
    
    trackSource.connect(gainNode);
    gainNode.connect(audioCtx.destination);
  }
  
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playPrev() {
  if (songsData.length === 0) return;

  let prevIndex = currentPlayingIndex - 1;
  if (prevIndex < 0) {
    prevIndex = songsData.length - 1;
  }
  playSongAtIndex(prevIndex);
}

// 修正：既存の handleSongEnd を以下のように書き換え
function handleSongEnd() {
  // 追加：曲終わりスリープタイマーのチェック
  if (sleepTimerMode === 'end') {
    const audio = document.getElementById('audioPlayer');
    audio.pause();
    sleepTimerMode = null;
    updatePlayerUI();
    return;
  }

  if (repeatMode === 'ONE') {
    playSongAtIndex(currentPlayingIndex);
  } else {
    playNext();
  }
}

function toggleShuffle() {
  isShuffle = !isShuffle;
  document.getElementById('miniShuffleBtn').classList.toggle('active', isShuffle);
  document.getElementById('fullShuffleBtn').classList.toggle('active', isShuffle);
}

function toggleRepeat() {
  if (repeatMode === 'OFF') repeatMode = 'ALL';
  else if (repeatMode === 'ALL') repeatMode = 'ONE';
  else repeatMode = 'OFF';

  const isBtnActive = repeatMode !== 'OFF';
  const miniBtn = document.getElementById('miniRepeatBtn');
  const fullBtn = document.getElementById('fullRepeatBtn');

  miniBtn.classList.toggle('active', isBtnActive);
  fullBtn.classList.toggle('active', isBtnActive);

  if (repeatMode === 'ONE') {
    miniBtn.innerHTML = '<i class="fa-solid fa-repeat"></i><span style="font-size: 9px; position: absolute; top:2px; right:2px;">1</span>';
    fullBtn.innerHTML = '<i class="fa-solid fa-repeat"></i><span style="font-size: 9px; position: absolute; top:2px; right:2px;">1</span>';
  } else {
    miniBtn.innerHTML = '<i class="fa-solid fa-repeat"></i>';
    fullBtn.innerHTML = '<i class="fa-solid fa-repeat"></i>';
  }
}

function updateProgress() {
  const audio = document.getElementById('audioPlayer');
  if (!audio.duration) return;

  const pct = (audio.currentTime / audio.duration) * 100;
  document.getElementById('miniProgressBar').style.width = `${pct}%`;

  const fullSlider = document.getElementById('fullSeekSlider');
  if (fullSlider && !isSeeking) {
    fullSlider.value = pct;
  }

  document.getElementById('currentTimeText').innerText = formatTime(audio.currentTime);
  document.getElementById('durationTimeText').innerText = formatTime(audio.duration);
}

function seekMiniPlayer(e) {
  const audio = document.getElementById('audioPlayer');
  if (!audio.duration) return;

  const rect = e.currentTarget.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const width = rect.width;

  audio.currentTime = (clickX / width) * audio.duration;
}

function onSeekSliderChange(val) {
  const audio = document.getElementById('audioPlayer');
  if (!audio.duration) return;

  audio.currentTime = (val / 100) * audio.duration;
}

function setVolume(val) {
  const audio = document.getElementById('audioPlayer');
  const numericVal = parseFloat(val);
  if (gainNode) {
    gainNode.gain.value = numericVal;
  } else if (audio) {
    audio.volume = numericVal;
  }
}
// 追加：再生速度を変更する関数
function setPlaybackRate(rate) {
  const audio = document.getElementById('audioPlayer');
  currentPlaybackRate = parseFloat(rate);
  if (audio) {
    audio.playbackRate = currentPlaybackRate;
    audio.defaultPlaybackRate = currentPlaybackRate;
    audio.preservesPitch = true;
    audio.webkitPreservesPitch = true;
    audio.mozPreservesPitch = true;
  }
  const rateText = document.getElementById('playbackRateText');
  if (rateText) {
    rateText.innerText = `${currentPlaybackRate.toFixed(1)}x`;
  }
}
function updatePlayerUI() {
  
  const audio = document.getElementById('audioPlayer');
  const isPaused = audio.paused;

  const song = songsData[currentPlayingIndex];

  const miniTitle = document.getElementById('playerMiniTitle');
  const miniArtist = document.getElementById('playerMiniArtist');
  const miniCover = document.getElementById('playerMiniCover');
  const miniPlayIcon = document.getElementById('miniPlayBtnIcon');

  const fullTitle = document.getElementById('fullPlayerTitle');
  const fullArtist = document.getElementById('fullPlayerArtist');
  const fullCover = document.getElementById('fullPlayerCover');
  const fullPlayIcon = document.getElementById('fullPlayBtnIcon');

  if (song) {
    miniTitle.innerText = song.title;
    miniArtist.innerText = song.artist;
    fullTitle.innerText = song.title;
    fullArtist.innerText = song.artist;

    if (song.coverUrl) {
      miniCover.innerHTML = `<img src="${song.coverUrl}">`;
      fullCover.innerHTML = `<img src="${song.coverUrl}">`;
    } else {
      miniCover.innerHTML = `<i class="fa-solid fa-music text-secondary"></i>`;
      fullCover.innerHTML = `<i class="fa-solid fa-music text-secondary" style="font-size: 80px;"></i>`;
    }

    // ▼【ここに追加】曲情報が更新されるタイミングで背景色も変更する
    updateAmbientBackground(song.coverUrl);

    setupMediaSession(song);
  }

  miniPlayIcon.className = isPaused ? 'fa-solid fa-play' : 'fa-solid fa-pause';
  fullPlayIcon.className = isPaused ? 'fa-solid fa-circle-play' : 'fa-solid fa-circle-pause';
}
// ジャケット画像から色を抽出して背景に適用する関数
function updateAmbientBackground(coverUrl) {
  const glowElement = document.getElementById('ambientGlow');
  if (!glowElement) return;

  if (!coverUrl) {
    glowElement.style.setProperty('--ambient-color', 'rgba(100, 100, 100, 0.3)');
    return;
  }

  const img = new Image();
  img.crossOrigin = 'Anonymous';
  img.src = coverUrl;
  img.onload = () => {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 50;
    canvas.height = 50;
    
    try {
      ctx.drawImage(img, 0, 0, 50, 50);
      const data = ctx.getImageData(0, 0, 50, 50).data;
      
      let r = 0, g = 0, b = 0, count = 0;
      for (let i = 0; i < data.length; i += 16) { // 間引いて高速化
        r += data[i];
        g += data[i+1];
        b += data[i+2];
        count++;
      }
      
      r = Math.floor(r / count);
      g = Math.floor(g / count);
      b = Math.floor(b / count);

      glowElement.style.setProperty('--ambient-color', `rgba(${r}, ${g}, ${b}, 0.5)`);
    } catch (e) {
      console.error("アンビエントカラーの抽出に失敗しました", e);
      glowElement.style.setProperty('--ambient-color', 'rgba(100, 100, 100, 0.3)');
    }
  };
}
function setupMediaSession(song) {
  if (!('mediaSession' in navigator)) return;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: song.artist,
    artwork: song.coverUrl ? [
      { src: song.coverUrl, sizes: '512x512', type: 'image/png' }
    ] : []
  });

  navigator.mediaSession.setActionHandler('play', () => togglePlay());
  navigator.mediaSession.setActionHandler('pause', () => togglePlay());
  navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
  navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
}

function setupAudioErrorHandling() {
  const audio = document.getElementById('audioPlayer');
  if (!audio) return;

  audio.onerror = (e) => {
    console.error("音声の読み込みエラーが発生しました", e);
    alert("この楽曲を再生できませんでした。次の曲へ移動します。");
    playNext();
  };

  const fullSlider = document.getElementById('fullSeekSlider');
  if (fullSlider) {
    fullSlider.addEventListener('mousedown', () => { isSeeking = true; });
    fullSlider.addEventListener('touchstart', () => { isSeeking = true; });
    fullSlider.addEventListener('change', () => { isSeeking = false; });
    fullSlider.addEventListener('touchend', () => { isSeeking = false; });
  }
}

/* ==========================================
9. Modals & Helper Functions
========================================== */
function openFullPlayer() {
  document.getElementById('fullPlayerModal').classList.add('active');
}

function closeFullPlayer() {
  document.getElementById('fullPlayerModal').classList.remove('active');
}

function openCreatePlaylistModal() {
  const el = document.getElementById('createPlaylistModal');
  const modal = bootstrap.Modal.getOrCreateInstance(el);
  modal.show();
}

async function saveNewPlaylist() {
  const nameInput = document.getElementById('newPlaylistNameInput');
  const coverInput = document.getElementById('playlistCoverInput');

  const name = nameInput.value.trim();
  if (!name) {
    alert('プレイリスト名を入力してください。');
    return;
  }

  try {
    let coverUrl = '';
    if (coverInput && coverInput.files[0]) {
      try {
        coverUrl = await readFileAsDataURL(coverInput.files[0]);
      } catch (e) {
        console.error("画像の読み込みに失敗しました", e);
      }
    }

    const newPlaylist = {
      name: name,
      coverUrl: coverUrl,
      songIds: []
    };

    const saved = await savePlaylistToDB(newPlaylist);
    if (!playlistsData) playlistsData = [];
    playlistsData.push(saved);

    nameInput.value = '';
    if (coverInput) coverInput.value = '';

    hideBootstrapModal('createPlaylistModal');
    populatePlaylistDropdown();
    renderPlaylists();
  } catch (e) {
    console.error("プレイリスト作成エラー:", e);
    const msg = e?.message || (typeof e === 'string' ? e : 'データベース処理エラー');
    alert("プレイリストの作成に失敗しました: " + msg);
  }
}

function openPlaylistDetail(id) {
  const playlist = playlistsData.find(p => p.id === id);
  if (!playlist) return;

  document.getElementById('playlistDetailTitle').innerText = playlist.name;
  const container = document.getElementById('playlistSongListContainer');
  container.innerHTML = '';

  const playlistSongs = songsData.filter(s => (playlist.songIds || []).includes(s.id));

  if (playlistSongs.length === 0) {
    container.innerHTML = '<li class="text-center text-muted py-4 small">楽曲が登録されていません</li>';
  } else {
    playlistSongs.forEach(song => {
      const li = document.createElement('li');
      li.className = 'song-item';
      li.innerHTML = `
        <div class="song-cover" onclick="playSongById(${song.id})">
        ${song.coverUrl ? `<img src="${song.coverUrl}">` : `<i class="fa-solid fa-music text-secondary"></i>`}
        </div>
        <div class="song-details" onclick="playSongById(${song.id})">
        <div class="song-title">${escapeHtml(song.title)}</div>
        <div class="song-artist">${escapeHtml(song.artist)}</div>
        </div>
      `;
      container.appendChild(li);
    });
  }

  const el = document.getElementById('playlistDetailModal');
  const modal = bootstrap.Modal.getOrCreateInstance(el);
  modal.show();
}

function openCurrentPlaylistModal() {
  const modal = document.getElementById('currentPlaylistModal');
  if (modal) {
    renderCurrentPlaylist();
    modal.style.display = 'flex';
  }
  closeFullPlayer();
}

function renderCurrentPlaylist() {
  const container = document.getElementById('currentPlaylistItems');
  if (!container) return;
  container.innerHTML = '';

  if (songsData.length === 0) {
    container.innerHTML = '<div class="text-center text-muted py-4 small">楽曲がありません</div>';
    return;
  }

  songsData.forEach((song, index) => {
    const isPlaying = currentPlayingIndex === index;
    const li = document.createElement('div');
    li.className = `song-item ${isPlaying ? 'active' : ''}`;
    li.innerHTML = `
      <div class="song-cover" onclick="playSongAtIndex(${index}); closeCurrentPlaylistModal();">
        ${song.coverUrl ? `<img src="${song.coverUrl}">` : `<i class="fa-solid ${isPlaying ? 'fa-volume-high text-danger' : 'fa-music text-secondary'}"></i>`}
      </div>
      <div class="song-details" onclick="playSongAtIndex(${index}); closeCurrentPlaylistModal();">
        <div class="song-title">${escapeHtml(song.title)}</div>
        <div class="song-artist">${escapeHtml(song.artist)}</div>
      </div>
    `;
    container.appendChild(li);
  });
}

function closeCurrentPlaylistModal() {
  const modal = document.getElementById('currentPlaylistModal');
  if (modal) modal.style.display = 'none';
}

function openSettingsModal() {
  const el = document.getElementById('settingsModal');
  const modal = bootstrap.Modal.getOrCreateInstance(el);
  modal.show();
}

async function clearAllData() {
  if (!confirm('すべての楽曲およびプレイリストデータを削除しますか？')) return;

  const database = await ensureDB();
  const tx1 = database.transaction('songs', 'readwrite');
  tx1.objectStore('songs').clear();

  const tx2 = database.transaction('playlists', 'readwrite');
  tx2.objectStore('playlists').clear();

  songsData = [];
  playlistsData = [];

  renderSongs();
  renderPlaylists();

  hideBootstrapModal('settingsModal');
  alert('すべてのデータを削除しました。');
}

function formatTime(sec) {
  if (isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#039;');
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = (e) => reject(e);
    reader.readAsDataURL(file);
  });
}
